<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Cadê?</title>

    <!-- Fontes do Google: Poppins (títulos) e Inter (textos) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    
        <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <main>
      <img src="assets/marca/cade-logo-principal.png" alt="Cadê?" width="200">

      <h1>Cadê seu objeto? Vamos procurar.</h1>

      <form action="inicio.html" method="get">
        <label for="email">E-mail institucional</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="seunome@ucsal.edu.br"
          autocomplete="email"
        >
        <p id="email-ajuda">Use o e-mail que a UCSAL te deu.</p>

        <button type="submit">Entrar</button>
      </form>
    </main>
  </body>
</html>
